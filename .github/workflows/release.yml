# Pushing a tag like v1.2.0 builds the extension and publishes a GitHub release with the Chrome and Firefox
# zips and the source archive AMO asks for. The tag has to match package.json's version, so the zips and the
# manifest agree with it: `npm version patch` (or minor, major) bumps both and tags, then
# `git push --follow-tags` starts this. Copies without the version in their names let the project page link
# to releases/latest/download/.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - run: pnpm check

      - run: pnpm zip:sources

      - name: Name copies for the latest download links
        run: |
          cd .output
          v="${GITHUB_REF_NAME#v}"
          cp "newtab-mii-plaza-$v-chrome.zip" newtab-mii-plaza-chrome.zip
          cp "newtab-mii-plaza-$v-firefox.zip" newtab-mii-plaza-firefox.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'NOTES'
          Install from the [project page](https://ankush.one/newtab-mii-plaza/): download the zip for your browser, then load it from `chrome://extensions` (Developer mode, Load unpacked, the unzipped folder) or `about:debugging#/runtime/this-firefox` (Load Temporary Add-on). `-sources.zip` is the source archive for Firefox Add-ons review.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            ".output/newtab-mii-plaza-$v-chrome.zip" \
            ".output/newtab-mii-plaza-$v-firefox.zip" \
            ".output/newtab-mii-plaza-$v-sources.zip" \
            .output/newtab-mii-plaza-chrome.zip \
            .output/newtab-mii-plaza-firefox.zip
